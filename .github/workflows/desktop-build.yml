name: desktop-build

# 通用构建通道：任何没有配置开发环境的机器，push 到 main 或手动触发后
# 在 GitHub 的 windows runner 上产出 ga-hub-desktop.exe，Actions 页面下载
# 即用（双击/建快捷方式均可，无需 Python/Node/Rust）。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "webui/**"
      - "server/**"
      - "desktop/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/desktop-build.yml"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            webui/package-lock.json
            package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install npm dependencies
        run: |
          npm ci
          npm ci --prefix webui

      - name: Build desktop app
        run: python scripts/build_all.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ga-hub-desktop-windows
          # 主 exe（内嵌前端）+ sidecar（Python 后端，运行时从主 exe 旁边解析）。
          # 两者必须放在同一目录，缺 sidecar 应用无法启动。
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/ga-hub-desktop.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/ga-hub-sidecar.exe
          if-no-files-found: error
