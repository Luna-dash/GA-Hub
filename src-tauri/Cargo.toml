[package]
name = "ga-hub-desktop"
version = "0.3.4"
description = "Tauri 2 shell for GA-Hub"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
