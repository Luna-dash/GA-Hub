[package]
name = "ga-hub-desktop"
version = "0.3.4"
description = "Tauri 2 shell for GA-Hub"
edition = "2021"
rust-version = "1.85"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 仅用于 feature 统一，不直接调用；**不要删**（删了会偶发编译失败，见下）。
# 链路：tauri-build / tauri-utils / tauri-plugin 2.x → schemars 0.8（preserve_order）
# → indexmap 1.x。schemars 的 preserve_order = ["indexmap"] 只开 indexmap 的 serde-1，
# 不开 std；而 indexmap 1.9.3 的 build.rs 在 CARGO_FEATURE_STD 缺席时跑 autocfg 探针：
#     match env::var_os("CARGO_FEATURE_STD") { Some(_) => emit("has_std"),
#         None => autocfg().emit_sysroot_crate("std") }
# 探针 spawn `rustc -` 并把源码写进 Stdio::piped() 的 stdin，**失败是静默的**
# （不报错，只是不 emit rustc-cfg=has_std）——本机正是 Stdio::piped() 的已知问题机器
# （ERROR_PIPE_BUSY / os error 231，见 docs/archive/desktop-sidecar-spawn-pipe-busy-20260924.md）。
#   → indexmap 落到 #[cfg(not(has_std))] 的三泛型 IndexMap<K,V,S>，
#   → schemars 的 preserve_order 代码写的是 IndexMap<K,V>：
#        error[E0107]: struct takes 3 generic arguments but 2 generic arguments were supplied
#        error: could not compile `schemars` (lib)
# 显式开启 std 即走 Some(_) 分支、跳过探针；2026-09-27 实测（temp/dsh_review/indexmap_probe/）：
# 强制探针失败时无此依赖即复现上面两条报错，有它则编译通过且 indexmap 的 build 输出
# 变成 rustc-cfg=has_std=True 且无 rustc-check-cfg（证明没起探针）。
# 升到不依赖 schemars 0.8 的 tauri 版本后才可以删（indexmap 2.x 无此 build script 探针）。
indexmap = { version = "1", features = ["std"] }

[dependencies]
serde_json = "1"
# 见 [build-dependencies] 同名条目：覆盖 target 侧依赖图（tauri-utils 也依赖 schemars）。
indexmap = { version = "1", features = ["std"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

[profile.release]
panic = "abort"
codegen-units = 16
lto = false
strip = false
