<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GA-Hub</title>
    <script>
      (function () {
        var root = document.documentElement;
        var themes = {
          'crisp-green-soft': 1, 'crisp-green-solid': 1,
          'crisp-brown-soft': 1, 'crisp-brown-solid': 1,
          'warm-parchment': 1, 'dark-forest': 1
        };
        var textures = { fiber: 1, cotton: 1, none: 1 };
        var theme = 'crisp-green-soft';
        var tex = 'fiber';
        var fontPack = 'system';
        var boldStyle = 'restrained';
        try {
          var t = localStorage.getItem('gahub.uiTheme.v1');
          if (t && themes[t]) theme = t;
          var x = localStorage.getItem('gahub.uiPaperTexture.v1');
          if (x && textures[x]) tex = x;
          var rawFont = localStorage.getItem('gahub.fontAppearance.v1');
          if (rawFont) {
            var parsed = JSON.parse(rawFont);
            if (parsed && (parsed.mode === 'enhanced' || parsed.mode === 'latin-enhanced')) fontPack = parsed.mode;
            if (parsed && parsed.boldStyle === 'standard') boldStyle = 'standard';
          }
        } catch (e) {}
        root.dataset.theme = theme;
        root.dataset.paperTexture = tex;
        root.dataset.fontPack = fontPack;
        root.dataset.boldStyle = boldStyle;
      })();
    </script>
  </head>
  <body class="bg-bg text-ink">
    <div id="root"></div>
    <script type="module" src="/src/message-dialog.tsx"></script>
  </body>
</html>
